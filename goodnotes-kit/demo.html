<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>goodnotes-kit Demo</title>
  <style>
    :root { --bg: #f6f3ec; --text: #1f2430; --accent: #2340a0; --card: #fff; --border: #e3dccb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16181d; --text: #e8e8ea; --accent: #8fa8ff; --card: #20232a; --border: #343844; } }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin: 16px 0; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 0 0 8px; }
    button { font: inherit; padding: 10px 16px; border-radius: 999px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    input[type=text] { font: inherit; width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: inherit; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    p.status { min-height: 1.5em; color: #2e7d32; }
  </style>
</head>
<body>
<main>
  <h1>goodnotes-kit</h1>
  <p>Beispiele für <code>goodnotes.js</code>: Jede Schaltfläche erzeugt eine <code>.goodnotes</code>-Datei.</p>

  <section>
    <h2>1. Text als bearbeitbare Striche</h2>
    <input type="text" id="text" value="Hallo Goodnotes!">
    <div class="row"><button id="textBtn">Als Goodnotes-Datei</button></div>
  </section>

  <section>
    <h2>2. Bilder → Goodnotes</h2>
    <input type="file" id="images" accept="image/*" multiple>
    <div class="row">
      <label><input type="checkbox" id="editable"> Schrift im Bild bearbeitbar machen</label>
      <button id="imgBtn">Als Goodnotes-Datei</button>
    </div>
  </section>

  <section>
    <h2>3. Eigene Striche (Spirale)</h2>
    <div class="row"><button id="drawBtn">Als Goodnotes-Datei</button></div>
  </section>

  <section>
    <h2>4. Alle Elemente (Text, Formen, Haftnotiz, Pfeile, Bild …)</h2>
    <div class="row"><button id="allBtn">Als Goodnotes-Datei</button></div>
  </section>

  <p class="status" id="status" role="status"></p>
</main>

<script src="goodnotes.js"></script>
<script>
  const G = window.GoodnotesExport;
  const say = (t) => { document.getElementById("status").textContent = t; };

  async function give(blob, name) {
    const file = new File([blob], name, { type: "application/octet-stream" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); say("Geteilt."); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    say(`„${name}“ heruntergeladen – in Goodnotes importieren.`);
  }

  document.getElementById("textBtn").addEventListener("click", async () => {
    const rec = G.createRecorder();
    rec.font = '64px "Comic Sans MS", "Chalkboard SE", cursive';
    rec.fillText(document.getElementById("text").value, 120, 250);
    const strokes = G.strokesFromOps(rec.ops);
    give(await G.buildDocument([{ strokes, sizePx: [1240, 1754] }], { ink: "#1d3a8a", title: "Text" }), "text.goodnotes");
  });

  document.getElementById("imgBtn").addEventListener("click", async () => {
    const files = [...document.getElementById("images").files];
    if (!files.length) { say("Bitte zuerst Bilder auswählen."); return; }
    say("Wird umgewandelt …");
    const images = await Promise.all(files.map(async (f) => { const im = new Image(); im.src = URL.createObjectURL(f); await im.decode(); return im; }));
    give(await G.fromImages(images, { editable: document.getElementById("editable").checked, title: "Bilder" }), "bilder.goodnotes");
  });

  document.getElementById("allBtn").addEventListener("click", async () => {
    const c = document.createElement("canvas"); c.width = c.height = 40;
    const x = c.getContext("2d"); x.fillStyle = "#d33"; x.fillRect(0, 0, 40, 40); x.clearRect(10, 10, 20, 20); // Mitte durchsichtig
    const png = new Uint8Array(await (await new Promise((r) => c.toBlob(r, "image/png"))).arrayBuffer());
    const items = [
      { type: "text", x: 40, y: 30, w: 515, h: 40, text: [{ text: "Alle Elemente: ", size: 22, bold: true, color: "#1d3a8a" }, { text: "Text, Formen, Pfeile", size: 22, italic: true }] },
      { type: "highlighter", pts: [[40, 100], [300, 100]], w: 16, color: [1, 0.85, 0, 0.45] },
      { type: "stroke", pts: Array.from({ length: 40 }, (_, i) => [40 + i * 6, 140 + Math.sin(i / 4) * 10]), w: 2, color: "#1d3a8a" },
      { type: "shape", shape: "rect", radius: 12, x: 40, y: 180, w: 140, h: 80, fill: "#dbe9ff", outline: { width: 2, color: "#1d3a8a" }, text: "Form mit Text", size: 14 },
      { type: "shape", shape: "ellipse", x: 200, y: 180, w: 140, h: 80, fill: "#ffe8d6", outline: { width: 2, color: "#c0392b" } },
      { type: "line", from: [40, 300], via: [190, 260], to: [340, 300], endArrow: "open", w: 2, color: "#1565c0" },
      { type: "sticky", x: 40, y: 330, w: 160, h: 120, text: "Haftnotiz" },
      { type: "image", data: png, x: 230, y: 340, w: 100, h: 100, angle: 0.3 },
    ];
    give(await G.buildDocument([{ sizePt: [595.28, 841.89], items, outline: "Alle Elemente" }], { title: "Alle Elemente" }), "alle-elemente.goodnotes");
  });

  document.getElementById("drawBtn").addEventListener("click", async () => {
    const pts = [];
    for (let t = 0; t < 40; t += 0.05) pts.push([297 + Math.cos(t) * t * 6, 420 + Math.sin(t) * t * 6]);
    const strokes = [{ pts, w: 3, color: "#c0392b" }, { pts: [[60, 760], [535, 760]], w: 6, color: "#2340a0" }];
    give(await G.buildDocument([{ strokes, sizePt: [595.28, 841.89] }], { title: "Spirale" }), "spirale.goodnotes");
  });
</script>
</body>
</html>
